                    - '$ref': '#/components/schemas/GoalieDaysRestRow'
                    - '$ref': '#/components/schemas/GoaliePenaltyShotsRow'
                    - '$ref': '#/components/schemas/GoalieSavesByStrengthRow'
                    - '$ref': '#/components/schemas/GoalieShootoutRow'
                    - '$ref': '#/components/schemas/GoalieStartedVsRelievedRow'
              total:
                type: integer
    PlayerSearch:
      description: 'Players matching a filter, at most 5 per page.'
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/StatsPlayer'
              total:
                type: integer
    SkaterLeaders:
      description: 'Top 10 single-season skater records; the stat key is `attribute`.'
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  oneOf:
                    - '$ref': '#/components/schemas/SkaterPointsLeaderRow'
                    - '$ref': '#/components/schemas/SkaterGoalsLeaderRow'
                    - '$ref': '#/components/schemas/SkaterAssistsLeaderRow'
                    - '$ref': '#/components/schemas/SkaterGamesPlayedLeaderRow'
              total:
                type: integer
    GoalieLeaders:
      description: 'Top 10 single-season goalie records; the stat key is `attribute`.'
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  oneOf:
                    - '$ref': '#/components/schemas/GoalieGaaLeaderRow'
                    - '$ref': '#/components/schemas/GoalieSavePctgLeaderRow'
                    - '$ref': '#/components/schemas/GoalieShutoutsLeaderRow'
                    - '$ref': '#/components/schemas/GoalieTimeOnIceLeaderRow'
                    - '$ref': '#/components/schemas/GoalieGamesPlayedLeaderRow'
              total:
                type: integer
    SkaterMilestones:
      description: Career milestones active skaters are approaching.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/SkaterMilestone'
              total:
                type: integer
    GoalieMilestones:
      description: Career milestones active goalies are approaching.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/GoalieMilestone'
              total:
                type: integer
    StatsTeams:
      description: Stats API teams.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/StatsTeam'
              total:
                type: integer
    ComponentSeasons:
      description: Default season and game type of the stats API.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/ComponentSeason'
              total:
                type: integer
    StatsGames:
      description: Games.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/StatsGame'
              total:
                type: integer
    Ping:
      description: 'Empty object; the stats API is up.'
      content:
        'application/json':
          schema:
            type: object
    Glossary:
      description: Glossary.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/GlossaryEntry'
              total:
                type: integer
    StatsConfig:
      description: Stats API configuration.
      content:
        'application/json':
          schema:
            '$ref': '#/components/schemas/StatsConfig'
    Countries:
      description: Countries.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/Country'
              total:
                type: integer
    Seasons:
      description: Season rules.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/SeasonRules'
              total:
                type: integer
    DraftYears:
      description: Draft years.
      content:
        'application/json':
          schema:
            type: object
            required:
              - data
              - total
            properties:
              data:
                type: array
                items:
                  '$ref': '#/components/schemas/DraftYear'
              total:
                type: integer
    # END GENERATED RESPONSES (pnpm openapi:schemas)
    Redirect:
      description: '`now` was resolved; follow `Location` to the dated resource.'
      headers:
        Location:
          schema: { type: string }
    BadRequest:
      description: 'Malformed `cayenneExp` or `sort`. Body carries the parser message.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown id, date or season (body is HTML).

paths:
  # ---------------------------------------------------------------- teams
  /roster/{teamAbbr}/{season}:
    get:
      tags: [teams, players]
      operationId: teamRoster
      x-sdk-method: [teams.teamRoster, players.playersByTeam]
      summary: Team roster for a season, grouped as forwards / defensemen / goalies.
      description: '`roster/{teamAbbr}/current` redirects to the current season; `now` is a 404 here.'
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
        - name: season
          in: path
          required: true
          description: 'Season in YYYYYYYY format, or `current`.'
          schema: { type: string, example: '20232024' }
      responses:
        '200': { $ref: '#/components/responses/Roster' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /roster-season/{teamAbbr}:
    get:
      tags: [teams]
      operationId: rosterSeasons
      x-sdk-method: [teams.rosterSeasons]
      summary: Every season a team has a roster for.
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
      responses:
        '200': { $ref: '#/components/responses/RosterSeasons' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scoreboard/{teamAbbr}/now:
    get:
      tags: [teams]
      operationId: teamScoreboard
      x-sdk-method: [teams.teamScoreboard]
      summary: "A team's recent and upcoming games, grouped by date. Answers 200 directly (no redirect)."
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
      responses:
        '200': { $ref: '#/components/responses/TeamScoreboard' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- standings
  /standings/{date}:
    get:
      tags: [standings, teams]
      operationId: standings
      x-sdk-method: [standings.leagueStandings, teams.teams]
      summary: 'League standings on a date. Body `{ standings: [...] }`.'
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/LeagueStandings' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /standings-season:
    get:
      tags: [standings]
      operationId: seasonStandingManifest
      x-sdk-method: [standings.seasonStandingManifest]
      summary: 'Every season with its standings start/end dates and rules. Body `{ seasons: [...] }`.'
      responses:
        '200': { $ref: '#/components/responses/StandingsSeasons' }

  # ---------------------------------------------------------------- schedule
  /schedule/{date}:
    get:
      tags: [schedule]
      operationId: schedule
      x-sdk-method: [schedule.dailySchedule, schedule.weeklySchedule]
      summary: 'Week of games starting at a date. Body `{ gameWeek: [{ date, games }], ... }`.'
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/WeeklySchedule' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /club-schedule/{teamAbbr}/month/{month}:
    get:
      tags: [schedule]
      operationId: teamMonthlySchedule
      x-sdk-method: [schedule.teamMonthlySchedule]
      summary: 'A team''s games in a month. Body `{ games: [...] }`.'
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
        - name: month
          in: path
          required: true
          description: 'YYYY-MM, or `now`.'
          schema: { type: string, example: '2023-11' }
      responses:
        '200': { $ref: '#/components/responses/ClubGames' }
        '307': { $ref: '#/components/responses/Redirect' }
  /club-schedule/{teamAbbr}/week/{date}:
    get:
      tags: [schedule]
      operationId: teamWeeklySchedule
      x-sdk-method: [schedule.teamWeeklySchedule]
      summary: 'A team''s games in the week of a date. Body `{ games: [...] }`.'
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/ClubGames' }
        '307': { $ref: '#/components/responses/Redirect' }
  /club-schedule-season/{teamAbbr}/{season}:
    get:
      tags: [schedule]
      operationId: teamSeasonSchedule
      x-sdk-method: [schedule.teamSeasonSchedule, helpers.gameIdsBySeason]
      summary: 'A team''s full season schedule. Body `{ games: [{ id, gameType, ... }] }`.'
      parameters:
        - $ref: '#/components/parameters/TeamAbbr'
        - name: season
          in: path
          required: true
          description: 'Season in YYYYYYYY format, or `now`.'
          schema: { type: string, example: '20232024' }
      responses:
        '200': { $ref: '#/components/responses/TeamSeasonSchedule' }
        '307': { $ref: '#/components/responses/Redirect' }
  /schedule-calendar/{date}:
    get:
      tags: [schedule]
      operationId: calendarSchedule
      summary: Schedule in calendar format for a date.
      x-sdk-method: [schedule.calendarSchedule]
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/CalendarSchedule' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /playoff-series/carousel/{season}:
    get:
      tags: [schedule]
      operationId: playoffCarousel
      summary: Playoff series overview up to the current round.
      x-sdk-method: [schedule.playoffCarousel]
      parameters:
        - $ref: '#/components/parameters/Season'
      responses:
        '200': { $ref: '#/components/responses/PlayoffCarousel' }
  /schedule/playoff-series/{season}/{series}:
    get:
      tags: [schedule]
      operationId: playoffSeriesSchedule
      summary: Schedule and results for one playoff series.
      x-sdk-method: [schedule.playoffSeriesSchedule]
      parameters:
        - $ref: '#/components/parameters/Season'
        - name: series
          in: path
          required: true
          description: 'Series letter, `a` (first round) through `o` (final).'
          schema: { type: string, pattern: '^[a-o]$' }
      responses:
        '200': { $ref: '#/components/responses/PlayoffSeriesSchedule' }
  /meta/playoff-series/{year}/{series}:
    get:
      tags: [schedule]
      operationId: playoffSeriesMeta
      summary: Round title and the two seeded teams of one playoff series.
      x-sdk-method: [schedule.playoffSeriesMeta]
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer, example: 2024 }
        - name: series
          in: path
          required: true
          description: 'Series letter, `a` (first round) through `o` (final). Case-insensitive.'
          schema: { type: string, pattern: '^[a-oA-O]$' }
      responses:
        '200': { $ref: '#/components/responses/PlayoffSeriesMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
  /playoff-bracket/{year}:
    get:
      tags: [schedule]
      operationId: playoffBracket
      summary: Full playoff bracket for a year.
      x-sdk-method: [schedule.playoffBracket]
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer, example: 2024 }
      responses:
        '200': { $ref: '#/components/responses/PlayoffBracket' }

  # ---------------------------------------------------------------- game center
  /gamecenter/{gameId}/boxscore:
    get:
      tags: [gameCenter]
      operationId: boxscore
      summary: Boxscore with team totals and per-player stats.
      x-sdk-method: [gameCenter.boxscore]
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/Boxscore' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gamecenter/{gameId}/play-by-play:
    get:
      tags: [gameCenter]
      operationId: playByPlay
      x-sdk-method: [gameCenter.playByPlay]
      summary: 'Every event. Body `{ plays: [{ typeDescKey, periodDescriptor, timeInPeriod, details }], ... }`.'
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/PlayByPlay' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gamecenter/{gameId}/landing:
    get:
      tags: [gameCenter]
      operationId: matchUp
      summary: 'Game landing summary: scoring by period, three stars, penalties.'
      x-sdk-method: [gameCenter.matchUp]
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/GameLanding' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gamecenter/{gameId}/right-rail:
    get:
      tags: [gameCenter]
      operationId: seasonSeriesMatchup
      summary: Season series record and context for a game.
      x-sdk-method: [gameCenter.seasonSeriesMatchup]
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/RightRail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wsc/game-story/{gameId}:
    get:
      tags: [gameCenter]
      operationId: gameStory
      summary: Narrative game story.
      x-sdk-method: [gameCenter.gameStory]
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/GameStory' }
        '404': { $ref: '#/components/responses/NotFound' }
  /score/{date}:
    get:
      tags: [gameCenter]
      operationId: dailyScores
      x-sdk-method: [gameCenter.dailyScores]
      summary: 'Scores and states for a day. Body `{ games: [{ id, gameState, awayTeam, homeTeam }], ... }`.'
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/DailyScores' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scoreboard/{date}:
    get:
      tags: [gameCenter]
      operationId: scoreboard
      x-sdk-method: [gameCenter.scoreboard]
      summary: 'Every game in the week around a date, grouped by date. `now` answers 200 directly (no redirect).'
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/Scoreboard' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wsc/play-by-play/{gameId}:
    get:
      tags: [gameCenter]
      operationId: wscPlayByPlay
      x-sdk-method: [gameCenter.wscPlayByPlay]
      summary: 'Every event as a bare array of flat plays (no `periodDescriptor` or `details`).'
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/WscPlayByPlay' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ppt-replay/{gameId}/{eventNumber}:
    get:
      tags: [gameCenter]
      operationId: playReplay
      x-sdk-method: [gameCenter.playReplay]
      summary: 'Replay card for one event. `goal` is present only when the event is a goal.'
      description: '`ppt-replay/goal/{gameId}/{eventNumber}` redirects here.'
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: eventNumber
          in: path
          required: true
          description: 'The play''s `eventId` from play-by-play.'
          schema: { type: integer, example: 193 }
      responses:
        '200': { $ref: '#/components/responses/PlayReplay' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meta/game/{gameId}:
    get:
      tags: [gameCenter]
      operationId: gameMeta
      x-sdk-method: [gameCenter.gameMeta]
      summary: Teams, season state and game state for a game page.
      parameters: [{ $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { $ref: '#/components/responses/GameMeta' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- misc (web)
  /network/tv-schedule/{date}:
    get:
      tags: [misc]
      operationId: tvSchedule
      x-sdk-method: [misc.tvSchedule]
      summary: National TV broadcasts for the week around a date.
      parameters:
        - $ref: '#/components/parameters/DateOrNow'
      responses:
        '200': { $ref: '#/components/responses/TvSchedule' }
        '307': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
  /partner-game/{countryCode}/now:
    get:
      tags: [misc]
      operationId: partnerGameOdds
      x-sdk-method: [misc.partnerGameOdds]
      summary: "Betting odds for today's games from the country's odds partner. Answers 200 directly (no redirect)."
      parameters:
        - name: countryCode
          in: path
          required: true
          description: Two-letter country code. Any value answers 200.
          schema: { type: string, example: US }
      responses:
        '200': { $ref: '#/components/responses/PartnerGameOdds' }
  /season:
    get:
      tags: [misc]
      operationId: seasonIds
      x-sdk-method: [misc.seasonIds]
      summary: Every season id, oldest first.
      responses:
        '200': { $ref: '#/components/responses/SeasonIds' }
  /meta:
    get:
      tags: [misc]
      operationId: meta
      x-sdk-method: [misc.meta]
      summary: Display metadata for players and teams. Omitted lists come back empty.
      parameters:
        - name: players
          in: query
          description: Comma-separated player ids.
          schema: { type: string, example: '8478402,8476945' }
        - name: teams
          in: query
          description: Comma-separated team abbreviations.
          schema: { type: string, example: 'TOR,BUF' }
      responses:
        '200': { $ref: '#/components/responses/Meta' }
  /location:
    get:
      tags: [misc]
      operationId: location
      x-sdk-method: [misc.location]
      summary: "The caller's country, from their IP address."
      responses:
        '200': { $ref: '#/components/responses/GeoLocation' }
  /postal-lookup/{postalCode}:
    get:
      tags: [misc]
      operationId: postalLookup
      x-sdk-method: [misc.postalLookup]
      summary: Teams whose broadcast market covers a postal code. Empty array outside every market.
      parameters:
        - name: postalCode
          in: path
          required: true
          schema: { type: string, example: '90210' }
      responses:
        '200': { $ref: '#/components/responses/PostalLookup' }

  # ---------------------------------------------------------------- draft
  # Draft paths take the draft year as YYYY, not YYYYYYYY.
  /draft/rankings/now:
    get:
      tags: [draft]
      operationId: draftRankingsNow
      x-sdk-method: [draft.rankings]
      summary: Central Scouting rankings of North American skaters for the current draft. Answers 200 directly (no redirect).
      responses:
        '200': { $ref: '#/components/responses/DraftRankings' }
  /draft/rankings/{season}/{category}:
    get:
      tags: [draft]
      operationId: draftRankings
      x-sdk-method: [draft.rankings]
