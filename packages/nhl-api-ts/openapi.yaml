openapi: 3.1.0
info:
  title: NHL API (as used by nhl-api-ts)
  version: 0.1.0
  summary: The subset of the public NHL web and stats APIs that nhl-api-ts calls.
  description: |
    Unofficial description of the public, unauthenticated NHL APIs. The NHL
    publishes no specification, so this file lists only the paths, parameters
    and envelopes that `nhl-api-ts` depends on. Response schemas are generated
    from the SDK's TypeScript types (`pnpm openapi:schemas`), which are derived
    from sampled responses. Fields marked optional are absent in some
    responses, and the NHL can change any body without notice.

    Two services are involved:

    - **Web API** `https://api-web.nhle.com/v1`: resource-shaped. Paths that
      accept `now` answer `307` with a redirect to the dated resource.
    - **Stats API** `https://api.nhle.com/stats/rest`: report-shaped. Filtered
      with `cayenneExp`, sorted with a JSON `sort`, and paged with
      `start`/`limit` (at most 100 rows per page; `limit=-1` returns all).

    Each operation's `x-sdk-method` names the SDK method that calls it.
  license:
    name: MIT (this description)
    identifier: MIT
servers:
  - url: https://api-web.nhle.com/v1
    description: NHL web API
security: [] # public API, no authentication
tags:
  - name: teams
    description: Teams, rosters and franchises.
  - name: standings
    description: League standings.
  - name: schedule
    description: Schedules and playoff brackets.
  - name: gameCenter
    description: Per-game data and daily scores.
  - name: stats
    description: Player and team statistics.
  - name: edge
    description: NHL EDGE puck and player tracking.
  - name: players
    description: Prospects and rosters.
  - name: misc
    description: Reference data.
  - name: draft
    description: Draft rankings, picks and the live draft tracker.

components:
  parameters:
    TeamAbbr:
      name: teamAbbr
      in: path
      required: true
      description: Three-letter team abbreviation, e.g. TOR.
      schema: { type: string, pattern: '^[A-Za-z]{3}$', example: TOR }
    Season:
      name: season
      in: path
      required: true
      description: Season in YYYYYYYY format.
      schema: { type: string, pattern: '^\d{8}$', example: '20232024' }
    DateOrNow:
      name: date
      in: path
      required: true
      description: 'YYYY-MM-DD, or `now` (redirects to today).'
      schema: { type: string, example: '2024-10-09' }
    Date:
      name: date
      in: path
      required: true
      description: YYYY-MM-DD.
      schema: { type: string, format: date, example: '2024-10-09' }
    GameId:
      name: gameId
      in: path
      required: true
      description: Game id in YYYYTTNNNN format.
      schema: { type: string, pattern: '^\d{10}$', example: '2023020280' }
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: integer, example: 8478402 }
    EdgeId:
      name: id
      in: path
      required: true
      description: Player id (skater/goalie reports) or team id (team reports).
      schema: { type: integer, example: 8478402 }
    EdgeSeason:
      name: season
      in: path
      required: true
      schema: { type: string, pattern: '^\d{8}$', example: '20232024' }
    EdgeGameType:
      name: gameType
      in: path
      required: true
      description: 2 = regular season, 3 = playoffs.
      schema: { type: integer, enum: [2, 3], default: 2 }
    EdgePositions:
      name: positions
      in: path
      required: true
      description: '`all`, `forwards` or `defense`. `F` / `D` also work, except on the shot-location top 10s (404).'
      schema: { type: string, enum: [all, forwards, defense], default: all }
    EdgeStrength:
      name: strength
      in: path
      required: true
      description: '`all`, `es` (even strength), `pp` (power play) or `pk` (penalty kill).'
      schema: { type: string, enum: [all, es, pp, pk], default: all }
    EdgeShotLocationCategory:
      name: category
      in: path
      required: true
      description: '`all`, `high` (high danger), `mid` (mid range) or `long` (long range).'
      schema: { type: string, enum: [all, high, mid, long], default: all }
    CayenneExp:
      name: cayenneExp
      in: query
      description: >-
        Filter expression, e.g. `gameTypeId=2 and seasonId<=20232024 and seasonId>=20232024`.
      schema: { type: string }
    FactCayenneExp:
      name: factCayenneExp
      in: query
      description: 'Base fact filter, e.g. `gamesPlayed>=1`.'
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: 'JSON array of `{ "property": string, "direction": "ASC" | "DESC" | "ASC_CI" | "DESC_CI" }`.'
      schema: { type: string, example: '[{"property":"points","direction":"DESC"}]' }
    Start:
      name: start
      in: query
      schema: { type: integer, default: 0 }
    Limit:
      name: limit
      in: query
      description: Page size. Capped at 100 by the server; -1 returns all rows.
      schema: { type: integer }
    IsAggregate:
      name: isAggregate
      in: query
      description: One row per entity across all matched seasons.
      schema: { type: boolean }
    IsGame:
      name: isGame
      in: query
      description: Game-level rows instead of season-level.
      schema: { type: boolean }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    # BEGIN GENERATED SCHEMAS (pnpm openapi:schemas)
    AwardSeason:
      type: object
      required:
        - gameTypeId
        - gamesPlayed
        - seasonId
      properties:
        gaa:
          type: number
          description: Goalies only
        gameTypeId:
          type: integer
          description: '1 = preseason, 2 = regular season, 3 = playoffs. Others exist.'
        gamesPlayed:
          type: number
        losses:
          type: number
          description: Goalies only
        otLosses:
          type: number
          description: Goalies only
        savePctg:
          type: number
          description: Goalies only
        seasonId:
          type: number
        wins:
          type: number
          description: Goalies only
        assists:
          type: number
        goals:
          type: number
        pim:
          type: number
        plusMinus:
          type: number
        points:
          type: number
        blockedShots:
          type: number
        hits:
          type: number
    BlockedShotDetails:
      type: object
      required:
        - xCoord
        - yCoord
        - zoneCode
        - blockingPlayerId
        - shootingPlayerId
        - eventOwnerTeamId
        - reason
      properties:
        xCoord:
          type: number
        yCoord:
          type: number
        zoneCode:
          type: string
          description: 'Known values: O, N, D. Others may appear.'
        blockingPlayerId:
          type: number
        shootingPlayerId:
          type: number
        eventOwnerTeamId:
          type: number
        reason:
          type: string
          description: 'Known values: blocked, teammate-blocked. Others may appear.'
    BlockedShotPlay:
      type: object
      required:
        - eventId
        - periodDescriptor
        - timeInPeriod
        - timeRemaining
        - situationCode
        - homeTeamDefendingSide
        - typeCode
        - typeDescKey
        - sortOrder
        - details
      properties:
        eventId:
          type: number
        periodDescriptor:
          '$ref': '#/components/schemas/PeriodDescriptor'
        timeInPeriod:
          type: string
        timeRemaining:
          type: string
        situationCode:
          type: string
          description: 'Known values: 1551, 1441, 1451, 1541, 0651. Others may appear.'
        homeTeamDefendingSide:
          type: string
          description: 'Known values: left, right. Others may appear.'
        typeCode:
          type: number
        typeDescKey:
          const: blocked-shot
        sortOrder:
          type: number
        details:
          '$ref': '#/components/schemas/BlockedShotDetails'
    Boxscore:
      type: object
      required:
        - id
        - season
        - gameType
        - limitedScoring
        - gameDate
        - venue
        - venueLocation
        - startTimeUTC
        - easternUTCOffset
        - venueUTCOffset
        - tvBroadcasts
        - gameState
        - gameScheduleState
        - regPeriods
        - awayTeam
        - homeTeam
      properties:
        id:
          type: number
        season:
          type: number
        gameType:
          type: integer
          description: '1 = preseason, 2 = regular season, 3 = playoffs. Others exist.'
        limitedScoring:
          type: boolean
        gameDate:
          type: string
        venue:
          '$ref': '#/components/schemas/LocalizedString'
        venueLocation:
          '$ref': '#/components/schemas/LocalizedString'
        startTimeUTC:
          type: string
        easternUTCOffset:
          type: string
        venueUTCOffset:
          type: string
        tvBroadcasts:
          type: array
          items:
            '$ref': '#/components/schemas/TvBroadcast'
        gameState:
          type: string
          description: 'Known values: FUT, PRE, LIVE, CRIT, FINAL, OFF. Others may appear.'
        gameScheduleState:
          type: string
          description: 'Known values: OK, PPD, SUSP, CNCL, TBD. Others may appear.'
        regPeriods:
          type: number
        awayTeam:
          '$ref': '#/components/schemas/BoxscoreTeam'
        homeTeam:
          '$ref': '#/components/schemas/BoxscoreTeam'
        periodDescriptor:
          '$ref': '#/components/schemas/PeriodDescriptor'
        clock:
          '$ref': '#/components/schemas/GameClock'
        playerByGameStats:
          '$ref': '#/components/schemas/BoxscorePlayerByGameStats'
        gameOutcome:
          '$ref': '#/components/schemas/GameOutcome'
    BoxscoreGoalie:
      type: object
      required:
        - playerId
        - sweaterNumber
        - name
        - position
      properties:
        playerId:
          type: number
        sweaterNumber:
          type: number
        name:
          '$ref': '#/components/schemas/LocalizedString'
        position:
          type: string
        starter:
          type: boolean
          description: Absent for preseason games
        evenStrengthShotsAgainst:
          type: string
        powerPlayShotsAgainst:
          type: string
        shorthandedShotsAgainst:
          type: string
        saveShotsAgainst:
          type: string
        savePctg:
          type: number
        evenStrengthGoalsAgainst:
          type: number
        powerPlayGoalsAgainst:
          type: number
        shorthandedGoalsAgainst:
          type: number
        pim:
          type: number
          description: Absent for preseason games
        goalsAgainst:
          type: number
        toi:
          type: string
        decision:
          type: string
        shotsAgainst:
          type: number
        saves:
          type: number
    BoxscorePlayerByGameStats:
      type: object
      required:
        - awayTeam
        - homeTeam
      properties:
        awayTeam:
          '$ref': '#/components/schemas/BoxscoreTeamPlayers'
        homeTeam:
          '$ref': '#/components/schemas/BoxscoreTeamPlayers'
    BoxscoreSkater:
      type: object
      required:
        - playerId
        - sweaterNumber
        - name
        - position
        - goals
        - assists
        - points
        - plusMinus
        - pim
        - hits
        - powerPlayGoals
        - sog
        - toi
        - blockedShots
        - shifts
        - giveaways
        - takeaways
      properties:
        playerId:
          type: number
        sweaterNumber:
          type: number
        name:
          '$ref': '#/components/schemas/LocalizedString'
        position:
          type: string
        goals:
          type: number
        assists:
          type: number
        points:
          type: number
        plusMinus:
          type: number
        pim:
          type: number
        hits:
          type: number
        powerPlayGoals:
          type: number
        sog:
          type: number
        faceoffWinningPctg:
          type: number
        toi:
          type: string
        blockedShots:
          type: number
        shifts:
          type: number
        giveaways:
          type: number
        takeaways:
          type: number
    BoxscoreTeam:
      type: object
      required:
        - id
        - commonName
        - abbrev
        - logo
        - darkLogo
        - placeName
        - placeNameWithPreposition
      properties:
        id:
          type: number
        commonName:
          '$ref': '#/components/schemas/LocalizedString'
        abbrev:
          type: string
        logo:
          type: string
        darkLogo:
          type: string
        placeName:
          '$ref': '#/components/schemas/LocalizedString'
        placeNameWithPreposition:
          '$ref': '#/components/schemas/LocalizedString'
        score:
          type: number
        sog:
          type: number
        radioLink:
          type: string
          description: Only present while the game is live
    BoxscoreTeamPlayers:
      type: object
      required:
        - forwards
        - defense
        - goalies
      properties:
        forwards:
          type: array
          items:
            '$ref': '#/components/schemas/BoxscoreSkater'
        defense:
          type: array
          items:
            '$ref': '#/components/schemas/BoxscoreSkater'
        goalies:
          type: array
          items:
            '$ref': '#/components/schemas/BoxscoreGoalie'
    ByTheNumbers:
      type: object
      required:
        - hardestShotSkater
        - maxSkatingSpeedSkater
      properties:
        games:
          type: number
        gameDate:
          type: string
        hardestShotSkater:
          '$ref': '#/components/schemas/ByTheNumbersHardestShot'
        maxSkatingSpeedSkater:
          '$ref': '#/components/schemas/ByTheNumbersMaxSkatingSpeed'
        totalDistanceSkatedSkater:
          '$ref': '#/components/schemas/ByTheNumbersDistanceSkater'
        totalDistanceSkatedTeam:
          '$ref': '#/components/schemas/ByTheNumbersDistanceTeam'
        totalDistanceSkatedLeague:
          '$ref': '#/components/schemas/ByTheNumbersDistanceLeague'
        sogTeam:
          '$ref': '#/components/schemas/ByTheNumbersSogTeam'
        highDangerSavesGoalie:
          '$ref': '#/components/schemas/ByTheNumbersHighDangerSaves'
        distanceMaxGame:
          '$ref': '#/components/schemas/ByTheNumbersDistanceMaxGame'
    ByTheNumbersDistanceGame:
      type: object
      required:
        - gameCenterLink
        - gameDate
        - isHomeTeam
        - homeTeam
        - awayTeam
        - distanceSkated
      properties:
        gameCenterLink:
          type: string
        gameDate:
          type: string
        isHomeTeam:
          type: boolean
        homeTeam:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        awayTeam:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        distanceSkated:
          '$ref': '#/components/schemas/EdgeMeasurement'
    ByTheNumbersDistanceLeague:
      type: object
      required:
        - distanceSkated
        - topFiveSkaters
      properties:
        distanceSkated:
          '$ref': '#/components/schemas/EdgeMeasurement'
        topFiveSkaters:
          type: array
          items:
            '$ref': '#/components/schemas/ByTheNumbersTopSkater'
    ByTheNumbersDistanceMaxGame:
      type: object
      required:
        - player
        - overlay
        - distanceSkated
      properties:
        player:
          '$ref': '#/components/schemas/ByTheNumbersPlayer'
        overlay:
          '$ref': '#/components/schemas/SkatingDistanceOverlay'
        distanceSkated:
          '$ref': '#/components/schemas/EdgeMeasurement'
    ByTheNumbersDistanceSkater:
      type: object
      required:
        - player
        - distanceSkated
      properties:
        player:
          '$ref': '#/components/schemas/ByTheNumbersPlayer'
        distanceSkated:
          '$ref': '#/components/schemas/SkaterComparisonDistanceMaxGame'
    ByTheNumbersDistanceTeam:
      type: object
      required:
        - team
        - game
        - topFiveSkaters
      properties:
        team:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        game:
          '$ref': '#/components/schemas/ByTheNumbersDistanceGame'
        topFiveSkaters:
          type: array
          items:
            '$ref': '#/components/schemas/ByTheNumbersTopSkater'
    ByTheNumbersHardestShot:
      type: object
      required:
        - player
        - overlay
        - shotSpeed
      properties:
        player:
          '$ref': '#/components/schemas/ByTheNumbersPlayer'
        overlay:
          '$ref': '#/components/schemas/ShotSpeedOverlay'
        shotSpeed:
          '$ref': '#/components/schemas/EdgeMeasurement'
    ByTheNumbersHighDangerSaves:
      type: object
      required:
        - overlay
        - player
        - saves
        - shotLocationDetails
      properties:
        overlay:
          '$ref': '#/components/schemas/SkatingDistanceOverlay'
        player:
          '$ref': '#/components/schemas/ByTheNumbersPlayer'
        saves:
          type: number
        shotLocationDetails:
          type: array
          items:
            '$ref': '#/components/schemas/ByTheNumbersSavesArea'
    ByTheNumbersMaxSkatingSpeed:
      type: object
      required:
        - player
        - overlay
        - skatingSpeed
      properties:
        player:
          '$ref': '#/components/schemas/ByTheNumbersPlayer'
        overlay:
          '$ref': '#/components/schemas/SkatingSpeedOverlay'
        skatingSpeed:
          '$ref': '#/components/schemas/EdgeMeasurement'
    ByTheNumbersPlayer:
      type: object
      required:
        - birthDate
        - id
        - firstName
        - lastName
        - sweaterNumber
        - position
        - slug
        - headshot
        - shootsCatches
        - team
      properties:
        birthDate:
          type: string
        id:
          type: number
        firstName:
          '$ref': '#/components/schemas/LocalizedString'
        lastName:
          '$ref': '#/components/schemas/LocalizedString'
        sweaterNumber:
          type: number
        position:
          type: string
        slug:
          type: string
        headshot:
          type: string
        shootsCatches:
          type: string
          description: 'Known values: L, R. Others may appear.'
        team:
          '$ref': '#/components/schemas/EdgeTeamRef'
    ByTheNumbersSavesArea:
      type: object
      required:
        - area
        - saves
      properties:
        area:
          type: string
        saves:
          type: number
    ByTheNumbersSogArea:
      type: object
      required:
        - area
        - shots
      properties:
        area:
          type: string
        shots:
          type: number
    ByTheNumbersSogTeam:
      type: object
      required:
        - overlay
        - team
        - shots
        - sogDetails
      properties:
        overlay:
          '$ref': '#/components/schemas/ByTheNumbersTeamOverlay'
        team:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        shots:
          type: number
        sogDetails:
          type: array
          items:
            '$ref': '#/components/schemas/ByTheNumbersSogArea'
    ByTheNumbersTeam:
      type: object
      required:
        - id
        - commonName
        - placeNameWithPreposition
        - abbrev
        - slug
        - teamLogo
        - conference
        - division
      properties:
        id:
          type: number
        commonName:
          '$ref': '#/components/schemas/LocalizedString'
        placeNameWithPreposition:
          '$ref': '#/components/schemas/LocalizedString'
        abbrev:
          type: string
        slug:
          type: string
        teamLogo:
          '$ref': '#/components/schemas/TeamLogo'
        conference:
          type: string
        division:
          type: string
    ByTheNumbersTeamOverlay:
      type: object
      required:
        - team
        - gameDate
        - awayTeam
        - homeTeam
        - gameOutcome
        - periodDescriptor
        - gameType
      properties:
        team:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        gameDate:
          type: string
        awayTeam:
          '$ref': '#/components/schemas/OverlayTeam'
        homeTeam:
          '$ref': '#/components/schemas/OverlayTeam'
        gameOutcome:
          '$ref': '#/components/schemas/GameOutcome'
        periodDescriptor:
          '$ref': '#/components/schemas/OverlayPeriod'
        gameType:
          type: integer
          description: '1 = preseason, 2 = regular season, 3 = playoffs. Others exist.'
    ByTheNumbersTopSkater:
      type: object
      required:
        - gameCenterLink
        - gameDate
        - playerOnHomeTeam
        - distanceSkated
        - toi
        - homeTeam
        - awayTeam
        - player
      properties:
        gameCenterLink:
          type: string
        gameDate:
          type: string
        playerOnHomeTeam:
          type: boolean
        distanceSkated:
          '$ref': '#/components/schemas/EdgeMeasurement'
        toi:
          type: number
        homeTeam:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        awayTeam:
          '$ref': '#/components/schemas/ByTheNumbersTeam'
        player:
          '$ref': '#/components/schemas/ByTheNumbersTopSkaterName'
    ByTheNumbersTopSkaterName:
      type: object
      required:
        - name
      properties:
        name:
          '$ref': '#/components/schemas/LocalizedString'
    CalendarSchedule:
      type: object
      required:
        - endDate
        - nextStartDate
        - previousStartDate
        - startDate
        - teams
      properties:
        endDate:
          type: string
        nextStartDate:
          type: string
        previousStartDate:
          type: string
        startDate:
          type: string
        teams:
          type: array
          items:
            '$ref': '#/components/schemas/CalendarScheduleTeam'
    CalendarScheduleTeam:
      type: object
      required:
        - id
        - seasonId
        - commonName
        - abbrev
        - name
        - placeNameWithPreposition
        - placeName
        - logo
        - darkLogo
        - french
      properties:
        id:
          type: number
        seasonId:
          type: number
        commonName:
          '$ref': '#/components/schemas/LocalizedString'
        abbrev:
          type: string
        name:
          '$ref': '#/components/schemas/LocalizedString'
        placeNameWithPreposition:
          '$ref': '#/components/schemas/LocalizedString'
        placeName:
          '$ref': '#/components/schemas/LocalizedString'
        logo:
          type: string
        darkLogo:
          type: string
        french:
          type: boolean
    CareerTotalsRegularSeason:
      type: object
      required:
        - assists
        - gamesPlayed
        - goals
        - pim
      properties:
        assists:
          type: number
        gamesPlayed:
          type: number
        gamesStarted:
          type: number
          description: Goalies only
        goals:
          type: number
        goalsAgainst:
          type: number
          description: Goalies only
        goalsAgainstAvg:
          type: number
          description: Goalies only
        losses:
          type: number
          description: Goalies only
        otLosses:
          type: number
          description: Goalies only
        pim:
          type: number
        savePctg:
          type: number
          description: Goalies only
        shotsAgainst:
          type: number
          description: Goalies only
        shutouts:
          type: number
          description: Goalies only
        timeOnIce:
          type: string
          description: Goalies only
        wins:
          type: number
          description: Goalies only
        gameWinningGoals:
          type: number
        otGoals:
          type: number
        plusMinus:
          type: number
        points:
          type: number
        powerPlayGoals:
          type: number
        powerPlayPoints:
          type: number
        shootingPctg:
          type: number
        shorthandedGoals:
          type: number
        shorthandedPoints:
          type: number
        shots:
          type: number
        avgToi:
          type: string
        faceoffWinningPctg:
          type: number
    CatGoalieDetail:
      type: object
      required:
        - player
        - seasonsWithEdgeStats
        - stats
        - shotLocationSummary
        - shotLocationDetails
      properties:
        player:
          '$ref': '#/components/schemas/GoalieDetailPlayer'
        seasonsWithEdgeStats:
          type: array
          items:
            '$ref': '#/components/schemas/EdgeSeasonAvailability'
        stats:
          '$ref': '#/components/schemas/GoalieDetailStats'
        shotLocationSummary:
          type: array
          items:
            '$ref': '#/components/schemas/CatGoalieLocationSummary'
        shotLocationDetails:
          type: array
          items:
            '$ref': '#/components/schemas/CatGoalieLocationArea'
    CatGoalieLocationArea:
      type: object
      required:
        - area
        - saves
        - savesPercentile
        - savePctg
        - savePctgPercentile
      properties:
        area:
          type: string
        saves:
          oneOf:
            - type: number
            - type: 'null'
        savesPercentile:
          oneOf:
            - type: number
            - type: 'null'
        savePctg:
          oneOf:
            - type: number
            - type: 'null'
        savePctgPercentile:
          oneOf:
            - type: number
            - type: 'null'
    CatGoalieLocationSummary:
      type: object
      required:
        - locationCode
        - goalsAgainst
        - goalsAgainstPercentile
        - goalsAgainstLeagueAvg
        - saves
        - savesPercentile
        - savesLeagueAvg
        - savePctg
        - savePctgPercentile
        - savePctgLeagueAvg
      properties:
        locationCode:
          type: string
        goalsAgainst:
          type: number
