                    - '$ref': '#/components/schemas/SkaterPenaltyKillRow'
                    - '$ref': '#/components/schemas/SkaterPenaltyShotsRow'
                    - '$ref': '#/components/schemas/SkaterPercentagesRow'
                    - '$ref': '#/components/schemas/SkaterPowerPlayRow'
                    - '$ref': '#/components/schemas/SkaterPuckPossessionsRow'
                    - '$ref': '#/components/schemas/SkaterRealtimeRow'
                    - '$ref': '#/components/schemas/SkaterScoringRatesRow'
                    - '$ref': '#/components/schemas/SkaterScoringPerGameRow'
                    - '$ref': '#/components/schemas/SkaterShootoutRow'
                    - '$ref': '#/components/schemas/SkaterSummaryShootingRow'
